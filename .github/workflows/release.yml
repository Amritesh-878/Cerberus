name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in tauri.conf.json"
          }

      - run: npx tauri build

      - name: Hash the installer
        shell: pwsh
        run: |
          $exe = @(Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($exe.Count -ne 1) { throw "Expected one installer, found $($exe.Count)" }
          $exe = $exe[0]
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$($exe.FullName).sha256", "$hash  $($exe.Name)`n")
          "$($exe.Name): $([math]::Round($exe.Length / 1MB, 2)) MB, sha256 $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Hand the installer to the release job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "Cerberus $GITHUB_REF_NAME" --generate-notes installer/*

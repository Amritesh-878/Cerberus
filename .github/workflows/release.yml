name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            installers: "nsis/*-setup.exe"
          - os: macos-latest
            bundle: dmg
            installers: "dmg/*.dmg"
          # The oldest LTS still on runners, so the AppImage's glibc is one most distros have.
          - os: ubuntu-24.04
            bundle: appimage,deb
            installers: "appimage/*.AppImage deb/*.deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # v6.1.1 by commit. It installs the pnpm version package.json's packageManager names.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test

      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in tauri.conf.json"
          }

      - run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Show what the app bundle holds
        if: runner.os == 'macOS'
        run: |
          # Tauri removes the loose .app once it is in the dmg, so look inside the dmg.
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" src-tauri/target/release/bundle/dmg/*.dmg
          app="$RUNNER_TEMP/dmg/Cerberus.app"
          echo "Contents/MacOS: $(ls "$app/Contents/MacOS" | xargs)" >> "$GITHUB_STEP_SUMMARY"
          echo "CFBundleExecutable: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" >> "$GITHUB_STEP_SUMMARY"
          codesign --verify --deep "$app"
          echo "codesign: ad-hoc signature verifies" >> "$GITHUB_STEP_SUMMARY"
          test -x "$app/Contents/MacOS/cerberus"
          test -x "$app/Contents/MacOS/cerberus-cli"
          test -x "$app/Contents/MacOS/cerberus-mcp"
          test -x "$app/Contents/MacOS/cerberus-live"
          hdiutil detach "$RUNNER_TEMP/dmg"

      - name: Show what the Linux packages hold
        if: runner.os == 'Linux'
        run: |
          bundle=src-tauri/target/release/bundle
          deb=$(ls "$bundle"/deb/*.deb)
          listed=$(dpkg-deb --contents "$deb")
          for bin in cerberus cerberus-cli cerberus-mcp cerberus-live; do
            echo "$listed" | grep -q "usr/bin/$bin\$" || { echo "$bin missing from $deb"; exit 1; }
          done
          echo "deb usr/bin: $(echo "$listed" | grep -o 'usr/bin/[^ ]*$' | xargs)" >> "$GITHUB_STEP_SUMMARY"
          image=$(ls "$bundle"/appimage/*.AppImage)
          chmod +x "$image"
          (cd "$RUNNER_TEMP" && "$OLDPWD/$image" --appimage-extract >/dev/null)
          for bin in cerberus cerberus-cli cerberus-mcp cerberus-live; do
            test -x "$RUNNER_TEMP/squashfs-root/usr/bin/$bin" || { echo "$bin missing from the AppImage"; exit 1; }
          done
          echo "AppImage usr/bin: $(ls "$RUNNER_TEMP/squashfs-root/usr/bin" | xargs)" >> "$GITHUB_STEP_SUMMARY"

      # Installs the setup as a user would, since the installer renames files that a build folder doesn't.
      - name: Install the Windows setup and check the claude wrapper's source is there
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-Item "src-tauri/target/release/bundle/nsis/*-setup.exe")[0]
          $dir = Join-Path $env:RUNNER_TEMP "cerberus-install"
          Start-Process $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait
          $files = @(Get-ChildItem $dir -File | ForEach-Object Name)
          "Installed: $($files -join ' ')" >> $env:GITHUB_STEP_SUMMARY
          # wrapper::install copies the first of these into <app data>\bin\claude.exe.
          if (-not ($files -contains "cerberus-cli.exe" -or $files -contains "cerberus.com")) {
            throw "Neither cerberus-cli.exe nor cerberus.com is in $dir, so the claude wrapper can't be placed"
          }
          foreach ($bin in "cerberus.exe", "cerberus-mcp.exe", "cerberus-live.exe") {
            if ($files -notcontains $bin) { throw "$bin is missing from $dir" }
          }
          Start-Process (Join-Path $dir "uninstall.exe") -ArgumentList "/S" -Wait

      - name: Hash the installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($pattern in "${{ matrix.installers }}".Split(' ')) {
            $exe = @(Get-Item "src-tauri/target/release/bundle/$pattern")
            if ($exe.Count -ne 1) { throw "Expected one $pattern, found $($exe.Count)" }
            $exe = $exe[0]
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            Copy-Item $exe.FullName out/
            [IO.File]::WriteAllText("out/$($exe.Name).sha256", "$hash  $($exe.Name)`n")
            "$($exe.Name): $([math]::Round($exe.Length / 1MB, 2)) MB, sha256 $hash" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Hand the installers to the release job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: out/*
          retention-days: 1
          if-no-files-found: error

  # The AUR's cerberus-bin for this release, built from the .deb just made; pushing it to the AUR is a manual step.
  aur:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-ubuntu-24.04
          path: installer

      - run: pacman -Syu --noconfirm namcap

      - name: Point the PKGBUILD at this release
        run: |
          version="${GITHUB_REF_NAME#v}"
          deb="installer/Cerberus_${version}_amd64.deb"
          sh packaging/aur/update.sh "$version" "$(sha256sum "$deb" | cut -d' ' -f1)" "$(sha256sum LICENSE | cut -d' ' -f1)"
          useradd -m builder
          cp -r packaging/aur /home/builder/aur
          # makepkg takes a source it finds beside the PKGBUILD, so the draft's .deb needs no download.
          cp "$deb" /home/builder/aur/
          chown -R builder /home/builder/aur
          cd /home/builder/aur
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          mkdir -p "$GITHUB_WORKSPACE/aur-out"
          cp PKGBUILD "$GITHUB_WORKSPACE/aur-out/cerberus-bin.PKGBUILD"
          cp .SRCINFO "$GITHUB_WORKSPACE/aur-out/cerberus-bin.SRCINFO"

      - name: Build the package and lint it
        working-directory: /home/builder/aur
        run: bash "$GITHUB_WORKSPACE/packaging/aur/check.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-aur
          path: aur-out/*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [build, aur]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: installer

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: >-
            macOS (Apple silicon): the app is not signed by Apple. After copying Cerberus to
            Applications, run `xattr -dr com.apple.quarantine /Applications/Cerberus.app` once,
            or open it, close the warning and choose Open Anyway in System Settings > Privacy &
            Security. Linux (x86_64, preview): run the AppImage after `chmod +x`, or install the
            .deb with `sudo apt install ./Cerberus_<version>_amd64.deb`. On Arch, the AUR package
            `cerberus-bin` installs this release's .deb. From the AppImage, Accounts > Install
            `cerberus` command writes `~/.local/bin/cerberus`, which runs the AppImage; install it
            again if you move the AppImage.
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "Cerberus $GITHUB_REF_NAME" --notes "$NOTES" --generate-notes installer/*

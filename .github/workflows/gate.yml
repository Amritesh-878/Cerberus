name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Tauri's documented Linux build packages, plus zsh and fish for the tests that read each shell's PATH.
      - name: Install the Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev zsh fish

      # v6.1.1 by commit. It installs the pnpm version package.json's packageManager names.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test

      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # A known vulnerability in a shipped dependency fails the gate; audit.toml lists the accepted warnings.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v6.1.1 by commit. It installs the pnpm version package.json's packageManager names.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Read from the lockfile alone: dev tools never ship, so only runtime packages count.
      - run: pnpm audit --prod --audit-level high

      # v2.90.8, by commit, with cargo-audit at an exact version.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cargo-audit@0.23.0

      - run: cargo audit
        working-directory: src-tauri

  # Builds the AUR package from the published .deb it names, as an Arch user's makepkg would.
  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: pacman -Syu --noconfirm namcap

      # makepkg refuses to run as root.
      - run: |
          useradd -m builder
          cp -r packaging/aur /home/builder/aur
          chown -R builder /home/builder/aur

      - name: Check .SRCINFO matches the PKGBUILD
        working-directory: /home/builder/aur
        run: sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -

      - name: Build the package and lint it
        working-directory: /home/builder/aur
        run: bash "$GITHUB_WORKSPACE/packaging/aur/check.sh"

  # The ruleset requires one check named `gate`; a skipped required job would count as a pass.
  gate:
    needs: [check, audit, aur]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success
      - run: test "${{ needs.audit.result }}" = success
      - run: test "${{ needs.aur.result }}" = success
